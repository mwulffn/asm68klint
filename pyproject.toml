[project]
name = "asm68klint"
version = "0.1.0"
description = "A linter for Motorola 68000 assembly: routine headers checked against what the code does to registers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Wulff Nielsen", email = "mwulff@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
asm68klint = "asm68klint.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
